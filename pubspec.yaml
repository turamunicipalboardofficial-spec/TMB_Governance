name: tmb_governance
description: "Tura Municipal Board - Admin/CEO/Driver Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.4.0
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.0.0
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.9
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.15
  flutter_local_notifications: ^18.0.1
  geolocator: ^11.0.0
  location: ^6.0.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  photo_view: ^0.15.0
  pull_to_refresh: ^2.0.0
  file_picker: ^8.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
  - assets/images/
  - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/tmb_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
